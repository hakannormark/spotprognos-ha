name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so that new Home Assistant or HACS rules show up without a push.
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Home Assistant ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The version hacs.json says is the minimum.
          - homeassistant: "2025.8.0"
            python: "3.13"
            requirements: requirements_test_min.txt
            lint: false
          # The newest version.
          - homeassistant: "2026.9.1"
            python: "3.14"
            requirements: requirements_test.txt
            lint: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install dependencies
        run: pip install -r ${{ matrix.requirements }}
      - name: Ruff lint
        if: matrix.lint
        run: ruff check .
      - name: Ruff format
        if: matrix.lint
        run: ruff format --check .
      - name: Pytest
        run: pytest

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
